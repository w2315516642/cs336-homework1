# 模型基础架构配置
model_config:
  vocab_size: 32000
  context_length: 256
  num_layers: 4
  d_model: 512
  num_heads: 16
  d_ff: 1344
  theta: 10000.0

# 优化器配置
optim_config:
  max_lr: 0.001    # 注意：代码里 alias 是 learning_rate
  min_lr: 0
  betas: 
    - 0.9
    - 0.95
  weight_decay: 0.1
  eps: 0.001

# 训练流程配置 (对应 train_config 别名)
train_config:
  batch_size: 64
  total_iters: 20000       # 注意：代码里 alias 是 total_iters
  warmup_iters: 1000
  cosine_iters: 20000
  max_l2_norm: 1.0
  checkpoint_interval: 100 # 根据 alias 对应的 checkpoint_interval 来命名
  max_ckpt_to_keep: 3      # 最大保持的ckpt数量
  output_dir: "./output/"
  train_data: "./data/owt_train.npy"
  valid_data: "./data/owt_valid.npy"
  log_interval: 100
  valid_interval: 1000
  valid_iters: 100

# 全局运行环境配置
is_checkpoint: false
checkpoint_path: ""
device: "cuda"       
dtype: "bfloat16"    
