# 模型基础架构配置
model_config:
  vocab_size: 10000
  context_length: 256
  num_layers: 4
  d_model: 512
  num_heads: 16
  d_ff: 1344
  theta: 10000.0

# 优化器配置
optim_config:
  max_lr: 0.001    # 注意：代码里 alias 是 learning_rate
  min_lr: 1.0e-05
  betas: 
    - 0.9
    - 0.95
  weight_decay: 1.0e-05
  eps: 0.001

# 训练流程配置 (对应 train_config 别名)
train_config:
  batch_size: 64
  total_iters: 100        # 注意：代码里 alias 是 total_iters
  warmup_iters: 20
  cosine_iters: 70
  max_l2_norm: 1.0
  checkpoint_interval: 10 # 注意：代码里 alias 是 checkpoint_interval
  output_dir: "./output/"
  train_data: "./data/owt_small.npy"
  valid_data: "./data/owt_small.npy"
  log_interval: 10

# 全局运行环境配置
is_checkpoint: false
checkpoint_path: ""
device: "cuda"       
dtype: "float16"    